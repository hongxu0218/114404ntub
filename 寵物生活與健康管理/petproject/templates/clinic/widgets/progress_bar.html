<div class="progress-bar-widget {{ css_class }}">
    {% if label %}
        <div class="progress-label d-flex justify-content-between align-items-center mb-2">
            <span class="label-text">{{ label }}</span>
            <span class="progress-value text-muted small">{{ current }}/{{ total }}</span>
        </div>
    {% endif %}
    
    <div class="progress" style="height: 8px;">
        <div class="progress-bar 
            {% if percentage >= 80 %}bg-success
            {% elif percentage >= 60 %}bg-info  
            {% elif percentage >= 40 %}bg-warning
            {% else %}bg-danger
            {% endif %}" 
            style="width: {{ percentage }}%;" 
            role="progressbar" 
            aria-valuenow="{{ current }}" 
            aria-valuemin="0" 
            aria-valuemax="{{ total }}"
            title="{{ percentage }}%">
        </div>
    </div>
    
    {% if percentage is not None %}
        <div class="progress-percentage text-center mt-1">
            <small class="text-muted">{{ percentage }}%</small>
        </div>
    {% endif %}
</div>

<style>
.progress-bar-widget {
    margin-bottom: 1rem;
}

.progress-label .label-text {
    font-weight: 500;
    color: var(--gray-700, #374151);
}

.progress {
    background-color: var(--gray-200, #e5e7eb);
    border-radius: 0.5rem;
    overflow: hidden;
}

.progress-bar {
    transition: width 0.3s ease-in-out;
    border-radius: 0.5rem;
}

.progress-percentage {
    font-size: 0.75rem;
}
</style>
