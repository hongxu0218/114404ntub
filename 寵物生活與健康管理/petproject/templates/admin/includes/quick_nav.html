<!-- 快速導航欄 - 可重用組件 -->
<style>
.quick-nav {
    background: white;
    padding: 15px 30px;
    border-radius: 12px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
}

.quick-nav-label {
    font-size: 14px;
    font-weight: 600;
    color: #6b7280;
    margin-right: 10px;
}

.quick-nav-link {
    padding: 10px 18px;
    background: #f3f4f6;
    border: 2px solid transparent;
    border-radius: 8px;
    color: #374151;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.quick-nav-link:hover {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
}

.quick-nav-link.active {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border-color: #667eea;
}

@media (max-width: 768px) {
    .quick-nav {
        padding: 15px;
    }

    .quick-nav-link {
        flex: 1 1 calc(50% - 5px);
        justify-content: center;
        font-size: 13px;
    }
}
</style>

<div class="quick-nav">
    <span class="quick-nav-label">🚀 快速導航：</span>
    <a href="{% url 'admin:index' %}" class="quick-nav-link {% if active_page == 'dashboard' %}active{% endif %}">
        <span>🏠</span> 儀表板
    </a>
    <a href="{% url 'admin:auth_user_changelist' %}" class="quick-nav-link {% if active_page == 'user' %}active{% endif %}">
        <span>👥</span> 用戶管理
    </a>
    <a href="{% url 'admin:petapp_vetclinic_changelist' %}" class="quick-nav-link {% if active_page == 'clinic' %}active{% endif %}">
        <span>🏥</span> 診所管理
    </a>
    <a href="{% url 'admin:petapp_vetdoctor_changelist' %}" class="quick-nav-link {% if active_page == 'doctor' %}active{% endif %}">
        <span>👨‍⚕️</span> 獸醫師管理
    </a>
    <a href="{% url 'admin:petapp_post_changelist' %}" class="quick-nav-link {% if active_page == 'post' %}active{% endif %}">
        <span>📝</span> 內容審核
    </a>
    <a href="{% url 'admin:petapp_handoffticket_changelist' %}" class="quick-nav-link {% if active_page == 'ticket' %}active{% endif %}">
        <span>🎫</span> 客服工單
    </a>
</div>
